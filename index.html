<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ninha Delivery mudou de endereço</title>
<meta http-equiv="refresh" content="3; url=https://ninhadelivery.github.io/">
<link rel="canonical" href="https://ninhadelivery.github.io/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f3f5fa; color: #172036; text-align: center }
  main { max-width: 360px; display: grid; gap: 12px }
  h1 { margin: 0; font-size: 1.4rem }
  p { margin: 0; color: #5d6680 }
  a { display: block; padding: 14px; border-radius: 12px; background: #f6c445; color: #3a2a00; font-weight: 700; text-decoration: none }
</style>
</head>
<body>
<main>
  <h1>A Ninha Delivery mudou de endereço</h1>
  <p>Agora é <b>ninhadelivery.github.io</b>. Se você tinha o app instalado, instale de novo pelo link novo e refaça o cadastro.</p>
  <a href="https://ninhadelivery.github.io/">Ir para o novo endereço</a>
</main>
<script>
  // remove o service worker e o cache do endereço antigo
  navigator.serviceWorker?.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  window.caches?.keys().then(ks => ks.forEach(k => caches.delete(k)));
  setTimeout(() => location.replace("https://ninhadelivery.github.io/"), 3000);
</script>
</body>
</html>
